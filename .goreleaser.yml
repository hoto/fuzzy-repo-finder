---
version: 2

builds:
  - main: ./cmd/fuzzy-repo-finder
    ldflags:
      - '-s -w -X github.com/hoto/fuzzy-repo-finder/pkg/config.Version={{.Version}} -X github.com/hoto/fuzzy-repo-finder/pkg/config.ShortCommit={{.ShortCommit}} -X github.com/hoto/fuzzy-repo-finder/pkg/config.BuildDate={{.Date}}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: binary
    formats: [binary]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
  - id: homebrew
    formats: [zip]
    name_template: >-
      {{ .Binary }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ .Tag }}-next'

release:
  prerelease: auto

changelog:
  sort: asc

homebrew_casks:
  - ids:
      - homebrew
    repository:
      owner: hoto
      name: homebrew-repo
    directory: Casks
    homepage: https://github.com/hoto/fuzzy-repo-finder
    description: Navigate locally cloned repos.
    # binaries are not signed/notarized, so drop the quarantine attribute on install
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fuzzy-repo-finder"]
          end
